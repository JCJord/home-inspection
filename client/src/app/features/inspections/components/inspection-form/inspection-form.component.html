<div class="form-container" [class.edit-mode]="isEditMode()">
  <div class="form-header">
    <button class="close-btn" (click)="close.emit()" [disabled]="isLoading()">
      <lucide-icon [name]="icons.ArrowLeft" [size]="20"></lucide-icon>
    </button>
    <h2>{{ isEditMode() ? 'Edit Inspection' : 'New Inspection' }}</h2>
  </div>

  <form [formGroup]="inspectionForm" (ngSubmit)="onSubmit()" class="form-body">
    @if (errorMessage()) {
    <div class="form-error-banner">
      <lucide-icon [name]="icons.AlertCircle" [size]="18" class="mr-2"></lucide-icon>
      <span>{{ errorMessage() }}</span>
    </div>
    }

    <div class="form-grid">
      <app-text-input name="address" label="Property Address" placeholder="123 Main St, City, State"></app-text-input>

      <div class="form-row">
        <app-text-input name="client_name" label="Client Name" placeholder="John Doe"></app-text-input>

        <app-text-input name="client_email" label="Client Email" type="email"
          placeholder="john@example.com"></app-text-input>
      </div>

      <div class="form-row">
        <app-text-input name="year_built" label="Year Built" type="number" placeholder="e.g. 1995"></app-text-input>

        <app-text-input name="square_footage" label="Sq Footage (Optional)" type="number"
          placeholder="e.g. 2500"></app-text-input>
      </div>

      @if (!isEditMode()) {
        <app-select-input 
          name="template_id" 
          label="Inspection Template (Default applies if left blank)" 
          [options]="availableTemplates()">
        </app-select-input>
      }

      <div class="form-section-title">Property Context</div>

      <div class="form-row">
        <app-text-input name="weather" label="Weather" placeholder="e.g. Sunny / Raining"></app-text-input>
        <app-text-input name="temperature" label="Temperature" placeholder="e.g. 75°F"></app-text-input>
      </div>

      <div class="form-row">
        <app-text-input name="occupancy" label="Occupancy Status" placeholder="e.g. Occupied / Vacant"></app-text-input>
        <app-text-input name="attendees" label="Attendees" placeholder="e.g. Buyer's Agent"></app-text-input>
      </div>

      <app-text-input name="foundation_type" label="Foundation Type" placeholder="e.g. Concrete Slab"></app-text-input>
    </div>

    <div class="form-actions">
      <app-button class="cancel-btn" variant="outline" (click)="close.emit()" [disabled]="isLoading()">Cancel</app-button>
      <app-button type="submit" [disabled]="inspectionForm.invalid || isLoading()" [isLoading]="isLoading()"
        variant="solid">
        {{ isEditMode() ? 'Save Changes' : 'Create Inspection' }}
      </app-button>
    </div>
  </form>
</div>
