<div class="flex flex-col flex-1 min-h-0 h-full bg-light-standard">
  <!-- Scrollable List -->
  <div class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
    @for (f of findings(); track f.id) {
    <button type="button" #findingItem [id]="'finding-item-' + f.id"
      class="finding-item group relative w-full text-left flex items-center gap-3 px-3 py-3 rounded-xl transition-all border-none outline-none focus:outline-none focus:ring-0 active:scale-[0.99]"
      style="outline: none;"
      [class.active]="f.id === selectedFindingId()"
      [class.hover:bg-surface-standard]="f.id !== selectedFindingId()" (click)="findingSelected.emit(f)">
      <div class="indicator-dot shrink-0" [attr.data-severity]="f.severity.toLowerCase()"></div>
      <div class="flex flex-col flex-1 min-w-0">
        <span class="text-xs font-semibold uppercase tracking-wider text-standard-muted">
          {{ f.severity }}
        </span>
        <span class="text-sm font-medium text-standard truncate" [class.text-primary]="f.id === selectedFindingId()">
          {{ getFindingLabel(f) }}
        </span>
      </div>

      <!-- Delete Inline Flow -->
      @if (!disabled()) {
      @if (confirmDeleteId() === f.id) {
      <!-- Placeholder to prevent flex layout bounce -->
      <div class="w-8 h-8 shrink-0"></div>

      <!-- Blur backdrop -->
      <div class="absolute inset-0 z-10 rounded-lg backdrop-blur-[2px] bg-white/40"
        (click)="$event.stopPropagation(); cancelDelete()"></div>

      <div class="absolute right-2 z-20" (click)="$event.stopPropagation()">
        <app-confirm-pill (confirm)="confirmDelete(f)" (cancel)="cancelDelete()">
        </app-confirm-pill>
      </div>
      } @else {
      <button type="button"
        class="w-8 h-8 flex items-center justify-center rounded-full text-standard-muted hover:text-red-500 hover:bg-red-500/10 transition-all shrink-0"
        (click)="initDelete(f, $event)">
        <lucide-icon [name]="icons.Trash2" [size]="16"></lucide-icon>
      </button>
      }
      }
    </button>
    } @empty {
    <div class="p-4 text-center text-sm text-standard-muted">
      No findings in this section yet.
    </div>
    }
  </div>

  <!-- Add Finding Sticky Footer -->
  @if (!disabled()) {
  <div class="p-3 border-t border-standard bg-surface-standard">
    <app-button variant="solid" [full]="true" (click)="addFindingTriggered.emit()">
      <lucide-icon [name]="icons.Plus" [size]="18"></lucide-icon>
      Add Finding
    </app-button>
  </div>
  }
</div>
