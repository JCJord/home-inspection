<div class="finding-card" [class.is-deleting]="isDeleting()">
  <div
    class="finding-severity-indicator"
    [attr.data-severity]="finding().severity.toLowerCase()"
  ></div>

  <div class="finding-card-content">
    <div class="finding-top-row" [class.confirming]="isConfirmingDelete()">
      <div class="finding-top-left">
        <span
          class="finding-severity"
          [attr.data-severity]="finding().severity.toLowerCase()"
        >
          {{ finding().severity }}
        </span>

        @if (finding().location) {
          <span class="finding-location">
            <lucide-icon [name]="icons.MapPin" [size]="12"></lucide-icon>
            {{ finding().location }}
          </span>
        }
      </div>

      <div class="action-area">
        @if (isConfirmingDelete()) {
          <div class="photo-action-pill confirming">
            <button type="button" class="action-btn cancel-delete" (click)="isConfirmingDelete.set(false)">
              <span class="action-text">Cancel</span>
            </button>
            <div class="divider"></div>
            <button type="button" class="action-btn confirm-delete" (click)="delete.emit()">
              <span class="action-text font-bold">Delete</span>
            </button>
          </div>
        } @else {
          <app-dropdown-menu [items]="menuItems()" icon="horizontal"></app-dropdown-menu>
        }
      </div>
    </div>

    <p class="finding-note">{{ finding().short_note }}</p>

    @if (resolvedImages().length > 0) {
      <div class="finding-photos-carousel">
        <app-photo-carousel [images]="resolvedImages()"></app-photo-carousel>
      </div>
    }
  </div>
</div>
