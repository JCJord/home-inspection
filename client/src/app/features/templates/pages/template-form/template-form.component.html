<div class="max-w-7xl mx-auto p-6 pb-24 relative min-h-full h-auto">
  <div class="form-page-header">
    <div class="flex items-center gap-3">
      <app-back-button fallbackUrl="/templates"></app-back-button>
      <div>
        <h1 class="text-2xl font-bold text-standard mb-1">New Blueprint</h1>
        <p class="text-standard-muted text-sm">Create a custom inspection blueprint from scratch.</p>
      </div>
    </div>
  </div>

  <div class="form-container max-w-2xl">
    <form [formGroup]="templateForm" (ngSubmit)="onSubmit()" class="form-body">
      
      @if (errorMessage()) {
      <div class="form-error-banner">
        <lucide-icon [name]="icons.AlertCircle" [size]="18" class="mr-2 flex-shrink-0"></lucide-icon>
        <span>{{ errorMessage() }}</span>
      </div>
      }

      <div class="form-grid">
        <app-text-input 
          name="name" 
          label="Blueprint Name" 
          placeholder="e.g. Comprehensive Residential Inspection">
        </app-text-input>
      </div>

      <div class="form-actions">
        <app-button 
          type="submit" 
          [disabled]="templateForm.invalid || isLoading()" 
          [isLoading]="isLoading()"
          variant="solid">
          Create Blueprint
        </app-button>
      </div>
      
    </form>
  </div>
</div>
