<div class="min-h-screen bg-slate-50 font-sans selection:bg-red-100 selection:text-red-900 flex flex-col justify-between not-found-gradient">
  <!-- Navbar -->
  <nav class="sticky top-0 z-50 w-full bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-2 group cursor-pointer hover:opacity-80 transition-opacity" title="Inspectly Homepage">
        <div class="flex items-center justify-center p-1">
          <img src="assets/icons/inspectly-logo.png" alt="Inspectly Logo" width="32" height="32" class="w-8 h-8" />
        </div>
        <span class="font-extrabold text-xl tracking-tight text-slate-900">Inspectly</span>
      </a>
      <div class="flex items-center gap-4">
        <a routerLink="/pricing" class="text-sm font-semibold text-slate-600 hover:text-slate-900 transition-colors">Pricing</a>
        <a routerLink="/features" class="text-sm font-semibold text-slate-600 hover:text-slate-900 transition-colors">Features</a>
      </div>
    </div>
  </nav>

  <!-- Error content -->
  <main class="flex-grow flex items-center justify-center py-16 px-6">
    <div class="max-w-md w-full text-center space-y-6">
      <div class="bg-red-50 text-red-600 rounded-full w-20 h-20 flex items-center justify-center mx-auto border border-red-100 shadow-sm animate-pulse">
        <lucide-icon [name]="icons.AlertTriangle" class="w-10 h-10"></lucide-icon>
      </div>
      
      <div class="space-y-2">
        <span class="text-xs font-bold text-red-500 uppercase tracking-widest">Error Code 404</span>
        <h1 class="text-3xl font-extrabold text-slate-900">Page Not Found</h1>
        <p class="text-slate-600 text-sm leading-relaxed max-w-xs mx-auto">
          The link you followed may be broken, or the page may have been removed. Let's get you back on track.
        </p>
      </div>

      <div class="pt-4 flex flex-col sm:flex-row gap-3 justify-center">
        <a routerLink="/" class="inline-flex justify-center items-center gap-2 px-6 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-700 transition-colors shadow-md hover:shadow-lg">
          <lucide-icon [name]="icons.ArrowLeft" class="w-4 h-4"></lucide-icon>
          Go Back Home
        </a>
        <a routerLink="/features" class="inline-flex justify-center items-center gap-2 px-6 py-3 rounded-xl bg-white border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50 transition-colors">
          Explore Features
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-12 px-6">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-slate-500">
      <div>&copy; 2026 Inspectly. All rights reserved.</div>
      <div class="flex gap-6">
        <a routerLink="/privacy" class="hover:underline hover:text-slate-800 transition-colors">Privacy Policy</a>
        <a routerLink="/terms" class="hover:underline hover:text-slate-800 transition-colors">Terms of Service</a>
      </div>
    </div>
  </footer>
</div>
