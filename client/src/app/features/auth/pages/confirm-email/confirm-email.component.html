<div class="auth-container">
  <div class="auth-card">
    <!-- Loading State -->
    <div *ngIf="state() === 'loading'" class="flex flex-col items-center justify-center py-8 text-center">
      <lucide-icon [img]="Loader2Icon" size="48" class="text-blue-600 animate-spin mb-4"></lucide-icon>
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Verifying your email...</h1>
      <p class="text-gray-600">Please wait a moment while we verify your account.</p>
    </div>

    <!-- Success State -->
    <div *ngIf="state() === 'success'" class="flex flex-col items-center justify-center py-8 text-center">
      <div class="flex items-center justify-center w-16 h-16 rounded-full bg-green-100 text-green-600 mb-6">
        <lucide-icon [img]="CheckCircle2Icon" size="32"></lucide-icon>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Email verified!</h1>
      <p class="text-gray-600">Taking you to your dashboard...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="state() === 'error'" class="flex flex-col items-center justify-center py-8 text-center">
      <div class="flex items-center justify-center w-16 h-16 rounded-full bg-red-100 text-red-600 mb-6">
        <lucide-icon [img]="XCircleIcon" size="32"></lucide-icon>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Verification Failed</h1>
      <p class="text-gray-600 mb-8">{{ errorMessage() }}</p>

      <div class="w-full space-y-4" *ngIf="email()">
        <app-button 
          variant="solid" 
          [full]="true" 
          [isLoading]="isResending()"
          (click)="resendEmail()">
          Resend Verification Email
        </app-button>
      </div>

      <div class="mt-6">
        <a routerLink="/auth/login" class="text-sm font-medium text-blue-600 hover:text-blue-500">
          Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
