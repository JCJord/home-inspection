<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="logo">
      <i class="fas fa-home"></i> Inspectly
    </div>
    <app-button variant="outline" (click)="onLogout()">Logout</app-button>
  </header>
  
  <main class="dashboard-content">
    <div class="welcome-card">
      <h2>Welcome, {{ authService.currentUser()?.name || 'Inspector' }}!</h2>
      <p>You have successfully authenticated and reached the dashboard.</p>
      <p class="email-text"><i class="fas fa-envelope"></i> {{ authService.currentUser()?.email }}</p>
    </div>
  </main>
</div>
