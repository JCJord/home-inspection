<div class="input-container">
  @if (label()) {
    <label [for]="name()" class="input-label">
      {{ label() }}
    </label>
  }

  <input
    [id]="name()"
    [type]="type()"
    [formControlName]="name()"
    [placeholder]="placeholder()"
    class="input-field"
    [class.input-field--error]="isInvalid"
  />

  @if (isInvalid) {
    <span class="input-error">
      {{ getFirstError() }}
    </span>
  }
</div>
