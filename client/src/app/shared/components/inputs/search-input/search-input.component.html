<div class="search-container">
  <div class="search-icon-wrapper">
    <lucide-icon [name]="icons.Search" [size]="18"></lucide-icon>
  </div>
  <input
    type="text"
    [value]="value()"
    (input)="onInputChange($any($event.target).value)"
    [placeholder]="placeholder()"
    class="search-field"
  />
</div>
