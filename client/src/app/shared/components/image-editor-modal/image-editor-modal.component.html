<dialog #editorDialog class="editor-overlay" (cancel)="close.emit()">
  <div class="editor-header">
    <button class="icon-btn cancel-btn" (click)="close.emit()" aria-label="Cancel">
      <lucide-icon [name]="icons['X']" [size]="20"></lucide-icon>
      <span class="btn-text">Cancel</span>
    </button>
    
    <div class="header-center">
      <h3 class="editor-title">Image Editor</h3>
    </div>

    <div class="header-actions">
      <button class="icon-btn save-btn" (click)="onSave()" aria-label="Save">
        <span class="btn-text">Save</span>
        <lucide-icon [name]="icons['Check']" [size]="20"></lucide-icon>
      </button>
    </div>
  </div>

  <div class="editor-main">
    <!-- Desktop Sidebar -->
    <aside class="editor-sidebar desktop-only">
      <div class="tool-group">
        <span class="group-label">Draw</span>
        <button class="tool-btn" [class.active]="activeTool() === 'brush'" (click)="activeTool.set('brush')" title="Brush">
          <lucide-icon [name]="icons['Pencil']" [size]="20"></lucide-icon>
        </button>
        <button class="tool-btn" [class.active]="activeTool() === 'circle'" (click)="activeTool.set('circle')" title="Circle">
          <lucide-icon [name]="icons['Circle']" [size]="20"></lucide-icon>
        </button>
        <button class="tool-btn" [class.active]="activeTool() === 'oval'" (click)="activeTool.set('oval')" title="Oval">
          <lucide-icon [name]="icons['Circle']" [size]="20" style="transform: scaleX(1.3)"></lucide-icon>
        </button>
        <button class="tool-btn" [class.active]="activeTool() === 'arrow'" (click)="activeTool.set('arrow')" title="Arrow">
          <lucide-icon [name]="icons['ArrowUpRight']" [size]="20"></lucide-icon>
        </button>
      </div>

      <div class="divider"></div>

      <div class="tool-group">
        <span class="group-label">Color</span>
        <button class="color-btn" [style.background-color]="strokeColor()" (click)="cycleColor()" title="Cycle Color">
          <div class="color-inner"></div>
        </button>
      </div>

      <div class="divider"></div>

      <div class="tool-group">
        <span class="group-label">View</span>
        <button class="tool-btn" [class.active]="activeTool() === 'pan'" (click)="activeTool.set('pan')" title="Pan">
          <lucide-icon [name]="icons['Hand']" [size]="20"></lucide-icon>
        </button>
        <button class="tool-btn" (click)="zoomIn()" [disabled]="zoomLevel() >= 4" title="Zoom In">
          <lucide-icon [name]="icons['ZoomIn']" [size]="20"></lucide-icon>
        </button>
        <button class="tool-btn" (click)="zoomOut()" [disabled]="zoomLevel() <= 1" title="Zoom Out">
          <lucide-icon [name]="icons['ZoomOut']" [size]="20"></lucide-icon>
        </button>
        <button class="tool-btn" (click)="rotate()" title="Rotate">
          <lucide-icon [name]="icons['RotateCw']" [size]="20"></lucide-icon>
        </button>
      </div>

      <div class="divider"></div>

      <div class="tool-group bottom">
        <button class="tool-btn secondary" (click)="undo()" title="Undo">
          <lucide-icon [name]="icons['Undo']" [size]="20"></lucide-icon>
        </button>
        <button class="tool-btn secondary" (click)="reset()" title="Reset">
          <lucide-icon [name]="icons['RotateCcw']" [size]="20"></lucide-icon>
        </button>
      </div>
    </aside>

    <div class="canvas-container" #containerElement [style.touch-action]="activeTool() === 'pan' ? 'auto' : 'none'">
      <div class="canvas-viewport" 
           [style.width.px]="baseDisplaySize().width * zoomLevel()"
           [style.height.px]="baseDisplaySize().height * zoomLevel()">
        <canvas 
          #canvasElement
          [style.width.px]="baseDisplaySize().width"
          [style.height.px]="baseDisplaySize().height"
          [style.transform]="'scale(' + zoomLevel() + ') rotate(' + rotation() + 'deg)'"
          [style.transform-origin]="'center center'"
          (mousedown)="startDrawing($event)"
          (mousemove)="draw($event)"
          (mouseup)="stopDrawing()"
          (mouseleave)="stopDrawing()"
          (touchstart)="startDrawing($event)"
          (touchmove)="draw($event)"
          (touchend)="stopDrawing()"
          (touchcancel)="stopDrawing()"
        ></canvas>
      </div>
      
      <!-- Floating Zoom Indicator -->
      <div class="zoom-indicator" *ngIf="zoomLevel() > 1">
        {{ zoomLevel() }}x
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="editor-bottom-nav mobile-only">
    <div class="nav-scroll-container">
      <button class="nav-item" [class.active]="activeTool() === 'brush'" (click)="activeTool.set('brush')">
        <lucide-icon [name]="icons['Pencil']" [size]="22"></lucide-icon>
        <span>Brush</span>
      </button>
      <button class="nav-item" [class.active]="activeTool() === 'circle'" (click)="activeTool.set('circle')">
        <lucide-icon [name]="icons['Circle']" [size]="22"></lucide-icon>
        <span>Circle</span>
      </button>
      <button class="nav-item" [class.active]="activeTool() === 'oval'" (click)="activeTool.set('oval')">
        <lucide-icon [name]="icons['Circle']" [size]="22" style="transform: scaleX(1.3)"></lucide-icon>
        <span>Oval</span>
      </button>
      <button class="nav-item" [class.active]="activeTool() === 'arrow'" (click)="activeTool.set('arrow')">
        <lucide-icon [name]="icons['ArrowUpRight']" [size]="22"></lucide-icon>
        <span>Arrow</span>
      </button>
      <div class="nav-divider"></div>
      <button class="nav-item color-item" (click)="cycleColor()">
        <div class="color-swatch" [style.background-color]="strokeColor()"></div>
        <span>Color</span>
      </button>
      <div class="nav-divider"></div>
      <button class="nav-item" [class.active]="activeTool() === 'pan'" (click)="activeTool.set('pan')">
        <lucide-icon [name]="icons['Hand']" [size]="22"></lucide-icon>
        <span>Pan</span>
      </button>
      <button class="nav-item" (click)="zoomIn()" [disabled]="zoomLevel() >= 4">
        <lucide-icon [name]="icons['ZoomIn']" [size]="22"></lucide-icon>
        <span>Zoom+</span>
      </button>
      <button class="nav-item" (click)="zoomOut()" [disabled]="zoomLevel() <= 1">
        <lucide-icon [name]="icons['ZoomOut']" [size]="22"></lucide-icon>
        <span>Zoom-</span>
      </button>
      <button class="nav-item" (click)="rotate()">
        <lucide-icon [name]="icons['RotateCw']" [size]="22"></lucide-icon>
        <span>Rotate</span>
      </button>
      <div class="nav-divider"></div>
      <button class="nav-item" (click)="undo()">
        <lucide-icon [name]="icons['Undo']" [size]="22"></lucide-icon>
        <span>Undo</span>
      </button>
      <button class="nav-item" (click)="reset()">
        <lucide-icon [name]="icons['RotateCcw']" [size]="22"></lucide-icon>
        <span>Reset</span>
      </button>
    </div>
  </nav>
</dialog>
